name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          fora=$(gofmt -l .)
          if [ -n "$fora" ]; then echo "sem gofmt:"; echo "$fora"; exit 1; fi
      - run: go vet ./...
      - run: go vet -tags integracao ./...
      # Os testes unitários. Os de integração precisam das imagens postgres:16/17/18 e de root, e
      # rodam na máquina de quem muda o motor (CONTRIBUTING.md); os do Docker aqui se pulam sozinhos.
      - run: go test ./...
      - name: install.sh
        run: sh -n install.sh
